<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 求片站是给手机用的：锁缩放、允许长按选中（查剧名要复制），不引缩放禁用。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <!-- 求片站不引后台那套 router / pinia 全家桶，用内联图标省一次请求。
         图标写死成 data URI：求片站的产物目录里只有 index.html 与 assets/，
         指向 /favicon.ico 会稳定 404（后台那份 favicon 在另一个目录）。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c74df'/%3E%3Cpath d='M9 9h14v14H9z' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M9 14h14M14 9v14' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>求片</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/request-main.ts"></script>
  </body>
</html>
