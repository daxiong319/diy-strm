name: auto-deploy

run-name: auto-deploy ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: auto-deploy
  cancel-in-progress: true

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/diy-strm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          short_sha="${GITHUB_SHA::12}"
          echo "tag=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (DockerHub)
        id: dockerhub
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "=== build+push attempt ${attempt}/3 ==="
            if docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance false \
              --sbom false \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --tag "${{ env.DOCKER_IMAGE }}:latest" \
              --tag "${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}" \
              --build-arg VERSION=latest \
              --build-arg BUILD_DATE=${{ steps.meta.outputs.build_date }} \
              .; then
              echo "DockerHub build+push OK"
              exit 0
            fi
            echo "build+push failed (attempt ${attempt}), retrying in 30s..."
            sleep 30
          done
          echo "::error::DockerHub build+push failed after 3 attempts"
          exit 1

      - name: Verify DockerHub image
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}"
          echo "verified: ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}"
